services:
  postgres:
    image: postgres:16
    container_name: team_portal_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fastapi_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - team_portal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fastapi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: team_portal_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - team_portal_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team_portal_app
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - DATABASE_URL=postgresql://admin:password@postgres:5432/fastapi_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - team_portal_network
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir app
      "

networks:
  team_portal_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: